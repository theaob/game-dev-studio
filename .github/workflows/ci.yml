name: CI & itch.io deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      channel:
        description: itch.io channel to push to
        default: html5
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="$(node -p "require('./package.json').version")-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests & bot playthroughs
        run: npm test

      - name: Build
        run: npx vite build

      - name: Check the build is a valid HTML5 upload
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          # itch.io serves the game from a sub-path, so asset URLs must be relative.
          if grep -Eq '(src|href)="/' dist/index.html; then
            echo "dist/index.html contains absolute asset paths; keep base: './' in vite.config.ts"
            exit 1
          fi
          du -sh dist

      - uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: dist
          retention-days: 14

  deploy:
    name: Push to itch.io
    needs: build
    # Deploy from main, from version tags, or when started by hand. Never from pull requests.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    # Secrets aren't allowed in an environment URL, so the page link is in the job summary instead.
    environment: itch.io
    concurrency:
      group: itch-deploy
      cancel-in-progress: false
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_USER: ${{ secrets.ITCH_USER }}
      ITCH_GAME: ${{ secrets.ITCH_GAME }}
      ITCH_CHANNEL: ${{ inputs.channel || 'html5' }}
    steps:
      - name: Check itch.io configuration
        run: |
          missing=0
          [ -n "$BUTLER_API_KEY" ] || { echo "::error::Secret BUTLER_API_KEY is not set"; missing=1; }
          [ -n "$ITCH_USER" ] || { echo "::error::Secret ITCH_USER is not set"; missing=1; }
          [ -n "$ITCH_GAME" ] || { echo "::error::Secret ITCH_GAME is not set"; missing=1; }
          exit $missing

      - uses: actions/download-artifact@v8
        with:
          name: web-build
          path: dist

      - name: Install butler
        run: |
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d "$HOME/butler"
          chmod +x "$HOME/butler/butler"
          echo "$HOME/butler" >> "$GITHUB_PATH"

      - name: Push to itch.io
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          butler -V
          target="$ITCH_USER/$ITCH_GAME:$ITCH_CHANNEL"
          echo "Deploying $VERSION to channel $ITCH_CHANNEL"
          butler push dist "$target" --userversion "$VERSION"
          butler status "$target"

      - name: Summary
        run: |
          {
            echo "### Deployed to itch.io 🎮"
            echo ""
            echo "- Version: \`${{ needs.build.outputs.version }}\`"
            echo "- Channel: \`$ITCH_CHANNEL\`"
            # Values from secrets are masked in logs and summaries, so this shows as *** on GitHub.
            echo "- Page: https://$ITCH_USER.itch.io/$ITCH_GAME"
          } >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Android APK
    needs: build
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
      apk: ${{ steps.apk.outputs.name }}
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The Android project builds against the Capacitor packages in node_modules.
      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: web-build
          path: dist

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Release builds (main, tags, manual runs) are signed with the upload key from secrets.
      # Pull requests, and repos without the secrets, are signed with the shared debug key in
      # android/app/debug.keystore, which keeps updates installable.
      - name: Set up signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Signing the APK with the shared debug key (no release key for this run)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy the web build into the Android project
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          fi
          ./gradlew assembleRelease --no-daemon -PversionCode="$GITHUB_RUN_NUMBER" -PversionName="$VERSION"

      - name: Name the APK
        id: apk
        run: |
          src=$(ls android/app/build/outputs/apk/release/*.apk | grep -v unsigned | head -1)
          [ -n "$src" ] || { echo "::error::No signed APK was produced"; ls -R android/app/build/outputs/apk; exit 1; }
          name="game-dev-studio-$VERSION.apk"
          mkdir -p apk && cp "$src" "apk/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -la apk

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: apk
          retention-days: 14

  deploy-android:
    name: Push APK to itch.io
    needs: [build, android]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    environment: itch.io
    concurrency:
      group: itch-deploy
      cancel-in-progress: false
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_USER: ${{ secrets.ITCH_USER }}
      ITCH_GAME: ${{ secrets.ITCH_GAME }}
      VERSION: ${{ needs.build.outputs.version }}
      APK: ${{ needs.android.outputs.apk }}
      SIGNED: ${{ needs.android.outputs.signed }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: apk

      - name: Install butler
        run: |
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d "$HOME/butler"
          chmod +x "$HOME/butler/butler"
          echo "$HOME/butler" >> "$GITHUB_PATH"

      # A channel named "android" is tagged as an Android download on the itch.io page.
      - name: Push to itch.io
        run: |
          target="$ITCH_USER/$ITCH_GAME:android"
          butler push "apk/$APK" "$target" --userversion "$VERSION"
          butler status "$target"
          signing="shared debug key"
          [ "$SIGNED" = "true" ] && signing="release key"
          {
            echo "### Android APK pushed to itch.io 🤖"
            echo ""
            echo "- Version: \`$VERSION\` (versionCode $GITHUB_RUN_NUMBER)"
            echo "- Channel: \`android\`"
            echo "- Signed with: $signing"
          } >> "$GITHUB_STEP_SUMMARY"
